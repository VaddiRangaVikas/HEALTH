<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Health Triage</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background: linear-gradient(135deg,#0f172a,#1e293b);
font-family: sans-serif;
}

.screen{
display:none;
}

.active{
display:block;
}

.card{
background:#1e293b;
border-radius:20px;
padding:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

.symptom{
transition:0.3s;
}

.symptom.selected{
background:#ef4444;
}

</style>

</head>

<body class="text-white flex items-center justify-center min-h-screen">

<div class="w-full max-w-sm">

<!-- HOME SCREEN -->

<div id="home" class="screen active">

<div class="card text-center">

<h1 class="text-3xl font-bold mb-4">
AI Health Triage
</h1>

<p class="text-gray-300 mb-6">
Early Risk Detection System
</p>

<button onclick="showScreen('input')"
class="bg-blue-500 w-full py-3 rounded-xl text-lg">
Start Health Check
</button>

</div>

</div>


<!-- SYMPTOM INPUT SCREEN -->

<div id="input" class="screen">

<div class="card">

<h2 class="text-xl font-bold mb-4">
Select Symptoms
</h2>

<div class="grid grid-cols-2 gap-3 mb-4">

<button class="symptom bg-gray-700 p-3 rounded-lg"
data-symptom="fever">Fever</button>

<button class="symptom bg-gray-700 p-3 rounded-lg"
data-symptom="cough">Cough</button>

<button class="symptom bg-gray-700 p-3 rounded-lg"
data-symptom="headache">Headache</button>

<button class="symptom bg-gray-700 p-3 rounded-lg"
data-symptom="vomiting">Vomiting</button>

<button class="symptom bg-gray-700 p-3 rounded-lg"
data-symptom="fatigue">Fatigue</button>

<button class="symptom bg-gray-700 p-3 rounded-lg"
data-symptom="chest pain">Chest Pain</button>

<button class="symptom bg-gray-700 p-3 rounded-lg col-span-2"
data-symptom="breathing difficulty">
Breathing Difficulty
</button>

</div>


<!-- OTHER SYMPTOMS -->

<input id="otherSymptoms"
placeholder="Other symptoms (example: sore throat)"
class="w-full p-3 rounded-lg text-black mb-4"/>


<!-- VOICE BUTTON -->

<button onclick="startVoice()"
class="bg-purple-500 w-full py-2 rounded-lg mb-4">
🎤 Speak Symptoms
</button>


<!-- ANALYZE -->

<button onclick="predict()"
class="bg-green-500 w-full py-3 rounded-xl">
Analyze Risk
</button>

</div>

</div>


<!-- RESULT SCREEN -->

<div id="result" class="screen">

<div class="card text-center">

<h2 class="text-xl font-bold mb-4">
Risk Assessment
</h2>

<p class="text-lg">
Risk Score:
<span id="score"></span>
</p>

<p class="text-lg mt-2">
Risk Level:
<span id="risk"></span>
</p>

<p class="mt-2">
Recommendation:
<span id="rec"></span>
</p>

<button onclick="showExplanation()"
class="bg-blue-500 mt-5 w-full py-2 rounded-lg">
Why this result?
</button>

<button onclick="showScreen('home')"
class="bg-gray-600 mt-3 w-full py-2 rounded-lg">
Start Again
</button>

</div>

</div>


<!-- EXPLANATION SCREEN -->

<div id="explain" class="screen">

<div class="card">

<h2 class="text-xl font-bold mb-4">
Explanation
</h2>

<ul id="explanationList"
class="list-disc pl-5 text-gray-300"></ul>

<button onclick="showScreen('home')"
class="bg-blue-500 mt-6 w-full py-2 rounded-lg">
Back to Home
</button>

</div>

</div>

</div>


<script>

let selectedSymptoms=[]
let explanationData=[]


function showScreen(screen){

document.querySelectorAll(".screen")
.forEach(s=>s.classList.remove("active"))

document.getElementById(screen)
.classList.add("active")

}



document.querySelectorAll(".symptom").forEach(btn=>{

btn.addEventListener("click",function(){

let symptom=this.dataset.symptom

if(selectedSymptoms.includes(symptom)){

selectedSymptoms=selectedSymptoms.filter(s=>s!==symptom)
this.classList.remove("selected")

}else{

selectedSymptoms.push(symptom)
this.classList.add("selected")

}

})

})



async function predict(){

let other=document.getElementById("otherSymptoms").value

let otherList=[]

if(other.trim()!==""){
otherList=other.split(",").map(s=>s.trim())
}

let allSymptoms=[...selectedSymptoms,...otherList]

if(allSymptoms.length===0){

alert("Please select or enter symptoms")
return

}

let res=await fetch("/predict",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
symptoms:allSymptoms
})

})

let data=await res.json()

document.getElementById("score").innerText=data.risk_score
document.getElementById("risk").innerText=data.risk_level
document.getElementById("rec").innerText=data.recommendation

explanationData=data.explanation

showScreen("result")

}



function showExplanation(){

let list=document.getElementById("explanationList")

list.innerHTML=""

explanationData.forEach(symptom=>{

let li=document.createElement("li")

li.innerText=symptom+" detected"

list.appendChild(li)

})

showScreen("explain")

}



function startVoice(){

const SpeechRecognition =
window.SpeechRecognition || window.webkitSpeechRecognition

const recognition = new SpeechRecognition()

recognition.lang = "en-US"

recognition.start()

recognition.onresult=function(event){

let text = event.results[0][0].transcript

document.getElementById("otherSymptoms").value = text

}

}

</script>

</body>
</html>
